name: Build BEYOND

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential \
            libglew-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev \
            libasound2-dev libpulse-dev \
            zip patchelf

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: |
          mkdir -p dist/lib

          cp build/out/beyond dist/
          cp /usr/lib/x86_64-linux-gnu/libGLEW.so.2.2 dist/lib/

          patchelf --set-rpath '$ORIGIN/lib' dist/beyond

          cp README.md dist/ 2>/dev/null || true

          cd dist
          zip -r ../Linux.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: Linux
          path: Linux.zip

  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          Copy-Item build/out/Release/beyond.exe dist/
          if (Test-Path README.md) {
            Copy-Item README.md dist/
          }

          Compress-Archive -Path dist/* -DestinationPath Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: Windows.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake glew glfw

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: |
          mkdir -p dist

          cp build/out/beyond dist/ 2>/dev/null || \
          cp build/out/beyond.app dist/ 2>/dev/null || true

          cp README.md dist/ 2>/dev/null || true

          cd dist
          zip -r ../macOS.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: macOS.zip

  release:
    needs:
      - build-linux
      - build-windows
      - build-macos

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip

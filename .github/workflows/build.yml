
name: Build BEYOND

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # =========================
  # LINUX
  # =========================
  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libglew-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libasound2-dev \
            libpulse-dev \
            zip \
            patchelf

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: |
          mkdir -p dist/lib

          cp build/out/beyond dist/BEYOND

          GLEW_PATH=$(ldconfig -p | awk '/libGLEW.so.2.2 / {print $NF; exit}')

          if [ -z "$GLEW_PATH" ]; then
            echo "GLEW library not found!"
            exit 1
          fi

          cp -L "$GLEW_PATH" dist/lib/libGLEW.so.2.2

          patchelf --set-rpath '$ORIGIN/lib' dist/BEYOND

          cp README.md dist/ 2>/dev/null || true

          cd dist
          zip -r ../BEYOND-Linux.zip .

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: BEYOND-Linux
          path: BEYOND-Linux.zip


  # =========================
  # WINDOWS
  # =========================
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          $exe = Get-ChildItem build -Filter beyond.exe -File -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "beyond.exe was not found!"
            Get-ChildItem build -Recurse
            exit 1
          }

          Copy-Item $exe.FullName dist/BEYOND.exe

          if (Test-Path README.md) {
            Copy-Item README.md dist/
          }

          Compress-Archive -Path dist/* -DestinationPath BEYOND-Windows.zip -Force

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: BEYOND-Windows
          path: BEYOND-Windows.zip


  # =========================
  # MACOS
  # =========================
  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: |
          mkdir -p dist

          cp build/out/beyond dist/BEYOND

          cp README.md dist/ 2>/dev/null || true

          cd dist
          zip -r ../BEYOND-macOS.zip .

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: BEYOND-macOS
          path: BEYOND-macOS.zip


  # =========================
  # RELEASE
  # =========================
  release:
    name: Create GitHub Release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: Initial Release
          files: artifacts/*.zip
          draft: false
          prerelease: false
